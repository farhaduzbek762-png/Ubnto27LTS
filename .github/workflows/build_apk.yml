name: Build Rust Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: "27.0.12077973" # در صورت نیاز نسخه NDK را تغییر دهید
  RUST_VERSION: "stable"
  RUST_PROJECT_PATH: "rust_core" 

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4.0.4

    - name: Install Android NDK
      run: |
        yes | sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_ENV

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.RUST_VERSION }}
        targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

    - name: Cache Cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install cargo-ndk
      run: cargo install cargo-ndk --locked

    - name: Build Rust library
      working-directory: ${{ env.RUST_PROJECT_PATH }}
      run: |
        cargo ndk \
          -t arm64-v8a \
          -t armeabi-v7a \
          -t x86_64 \
          -o ../app/src/main/jniLibs \
          --platform 24 \
          build --release

    # ✅ مرحله جدید: ساخت خودکار فایل debug.keystore برای CI
    - name: Generate Debug Keystore
      run: |
        keytool -genkeypair -v \
          -keystore "${RUNNER_TEMP}/debug.keystore" \
          -storepass android -keypass android \
          -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"

    # ✅ مرحله اصلاح‌شده: پاس دادن مسیر keystore به Gradle
    - name: Build Debug APK
      run: |
        gradle assembleDebug \
          -Pandroid.injected.signing.store.file="${RUNNER_TEMP}/debug.keystore" \
          -Pandroid.injected.signing.store.password=android \
          -Pandroid.injected.signing.key.alias=androiddebugkey \
          -Pandroid.injected.signing.key.password=android

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7
